version: '3.8'

services:
  # Frontend Service - TypeScript React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_DEBUG=true
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - regression-network

  # Backend Service - JavaScript Node.js/Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - PYTHON_API_URL=http://python-api:5000
      - DEBUG=true
    depends_on:
      - python-api
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - regression-network

  # Python API Service - Flask
  python-api:
    build:
      context: ./apis
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DEBUG=true
    depends_on:
      - mongodb
    volumes:
      - ./apis:/app
      - ./test-data:/app/test-data
    networks:
      - regression-network

  # MongoDB Database
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=regression_test_db
    volumes:
      - mongodb_data:/data/db
      - ./test-data/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - regression-network

  # Redis Cache (for circular reference caching issues)
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - regression-network

volumes:
  mongodb_data:

networks:
  regression-network:
    driver: bridge
